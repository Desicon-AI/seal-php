name: SDK contract tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -l src/Client.php
      - run: php tests/contract.php
      - run: |
          for rule in honeypot sqli xss; do
            php tests/enforcement.php "$rule" report
            php tests/enforcement.php "$rule" drop
          done
